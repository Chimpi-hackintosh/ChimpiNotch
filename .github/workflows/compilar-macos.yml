name: ChimpiNotch | Compilar e publicar Release

# Somente o proprietário inicia o workflow pelo botão Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ github.actor == 'Chimpi-hackintosh' }}
    name: Compilar macOS e enviar para Releases
    runs-on: macos-15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Verificar o compilador Swift
        run: |
          xcodebuild -version
          xcrun swiftc -version

      - name: Compilar aplicativo universal Intel e Apple Silicon
        run: bash scripts/compilar-macos.sh

      - name: Verificar executável e assinatura
        run: |
          xcrun lipo -info build/ChimpiNotch.app/Contents/MacOS/ChimpiNotch
          codesign --verify --verbose build/ChimpiNotch.app
          test -s build/ChimpiNotch-macOS-Universal.zip

      - name: Publicar ZIP no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          ZIP="build/ChimpiNotch-macOS-Universal.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Uma tentativa repetida substitui o ZIP da mesma versão
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "ChimpiNotch $TAG" \
              --notes "ChimpiNotch para macOS 13+ (Intel e Apple Silicon). Compilado no GitHub Actions. O aplicativo é assinado ad-hoc e não é notarizado."
          fi
