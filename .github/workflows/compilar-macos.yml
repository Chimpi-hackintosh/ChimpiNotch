name: Compilar ChimpiNotch para macOS

# Execução exclusivamente manual pela aba Actions do GitHub
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Somente a conta proprietária pode executar os passos de compilação
    if: ${{ github.actor == 'Chimpi-hackintosh' }}
    name: Gerar app universal
    runs-on: macos-15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Conferir Xcode e Swift
        run: |
          xcodebuild -version
          xcrun swiftc -version
      - name: Compilar para Intel e Apple Silicon
        run: bash scripts/compilar-macos.sh
      - name: Validar app
        run: |
          xcrun lipo -info build/ChimpiNotch.app/Contents/MacOS/ChimpiNotch
          codesign --verify --verbose build/ChimpiNotch.app
      - name: Enviar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: ChimpiNotch-macOS-Universal
          path: build/ChimpiNotch-macOS-Universal.zip
          if-no-files-found: error

      - name: Publicar automaticamente no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          ZIP="build/ChimpiNotch-macOS-Universal.zip"
          test -s "$ZIP"
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "ChimpiNotch $TAG" \
            --notes "ChimpiNotch para macOS 13+ (Intel e Apple Silicon). Compilado pelo GitHub Actions na execução #${GITHUB_RUN_NUMBER}. ZIP com o aplicativo .app; assinatura ad-hoc, sem notarização."
